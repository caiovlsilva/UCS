name: OCR Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ocr-queue
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Contar imagens na fila
        id: check
        run: |
          N=$(find queue -maxdepth 1 \( -name '*.png' -o -name '*.jpg' \) 2>/dev/null | wc -l)
          echo "count=$N" >> $GITHUB_OUTPUT
          echo "Fila: $N imagem(ns)"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.count != '0'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        if: steps.check.outputs.count != '0'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar OCR
        if: steps.check.outputs.count != '0'
        run: python scripts/ocr.py

      - name: Commit e push (com retry robusto)
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/ results/
          git diff --staged --quiet || git commit -m "OCR $(date -u +%Y%m%d-%H%M%S)"
          
          for i in 1 2 3 4 5; do
            echo "=== Tentativa $i de 5 ==="
            git pull --rebase origin main || {
              echo "Rebase falhou, tentando merge"
              git rebase --abort || true
              git pull --no-rebase --no-edit origin main || true
            }
            if git push origin main; then
              echo "✅ Push OK na tentativa $i"
              exit 0
            fi
            echo "❌ Push falhou na tentativa $i, aguardando $((i * 5))s..."
            sleep $((i * 5))
          done
          
          echo "❌ Push falhou após 5 tentativas"
          exit 1
