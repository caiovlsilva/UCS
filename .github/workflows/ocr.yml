name: OCR Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ocr-queue
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Contar imagens na fila
        id: check
        run: |
          N=$(find queue -maxdepth 1 \( -name '*.png' -o -name '*.jpg' \) 2>/dev/null | wc -l)
          echo "count=$N" >> $GITHUB_OUTPUT
          echo "Fila: $N imagem(ns)"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.count != '0'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        if: steps.check.outputs.count != '0'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache modelos PaddleOCR
        if: steps.check.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-v5-models
          restore-keys: |
            paddleocr-v5-models

      - name: Pré-baixar modelos PaddleOCR
        if: steps.check.outputs.count != '0'
        run: |
          python - <<'EOF'
          from paddleocr import PaddleOCR
          print("[CACHE] Baixando modelos...")
          for kw in ({"lang": "en", "use_angle_cls": False, "show_log": False}, {"lang": "en"}):
              try:
                  PaddleOCR(**kw)
                  break
              except (TypeError, ValueError) as e:
                  print(f"[CACHE] kwargs rejeitados: {e}")
          print("[CACHE] Modelos prontos")
          EOF

      - name: Rodar OCR
        if: steps.check.outputs.count != '0'
        run: python scripts/ocr.py

      - name: Commit e push
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue/ results/
          git diff --staged --quiet || git commit -m "OCR $(date -u +%Y%m%d-%H%M%S)"

          for i in 1 2 3 4 5; do
            echo "=== Tentativa $i de 5 ==="
            git pull --rebase --autostash origin main || {
              git rebase --abort || true
              git pull --no-rebase --no-edit origin main || true
            }
            if git push origin main; then
              echo "✅ Push OK"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
