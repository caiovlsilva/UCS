name: OCR Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ocr-queue
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Contar imagens na fila
        id: check
        run: |
          N=$(find queue -maxdepth 1 \( -name '*.png' -o -name '*.jpg' \) 2>/dev/null | wc -l)
          echo "count=$N" >> $GITHUB_OUTPUT
          echo "Fila: $N imagem(ns)"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.count != '0'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        if: steps.check.outputs.count != '0'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar OCR
        if: steps.check.outputs.count != '0'
        run: python scripts/ocr.py

      - name: Commit e push (com rebase)
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/ results/
          git diff --staged --quiet || git commit -m "OCR $(date -u +%Y%m%d-%H%M%S)"
          # ★ NOVO: rebase antes do push para resolver concorrência
          git pull --rebase origin main || {
            echo "=== REBASE FALHOU — tentando rebase com estratégia de merge ==="
            git rebase --abort || true
            git pull --no-rebase --no-edit origin main
          }
          git push origin main
